<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Club Mick</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main class="club-shell">
    <header class="club-header" aria-label="Club Mick">
      <div class="crest" aria-hidden="true">
        <div class="portrait-placeholder">CM</div>
      </div>
      <div class="club-title-block">
        <h1>CLUB MICK</h1>
        <p>GOOD COMPANY • GREAT TIMES</p>
      </div>
    </header>

    <section class="game-grid" aria-label="Club Mick activities">
      <a class="game-tile primbee" href="games/primbee-gold/index.html" aria-label="Play Primbee Gold">
        <img src="games/primbee-gold/design-assets/lake-illawarra-sunset.png" alt="Lake Illawarra sunset">
        <div class="tile-shade"></div>
        <strong>PRIMBEE<br>GOLD</strong>
        <span>PLAY</span>
      </a>
      <div class="reserved-slot" aria-hidden="true"></div>
      <div class="reserved-slot" aria-hidden="true"></div>
      <div class="reserved-slot" aria-hidden="true"></div>
    </section>

    <footer>Tap a game to begin</footer>
  </main>
  <aside class="portrait-message"><strong>ROTATE TABLET</strong><span>Club Mick is designed for landscape tablets.</span></aside>
</body>
</html>
